[settings]
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"
idiomatic_version_file_enable_tools = ["node"]

[tools]
node = "latest"
pnpm = "latest"
aube = "latest"
npm = "latest"

[bootstrap.repos]
"~/dotfiles" = { url = "https://github.com/MiGoYAm/dotfiles.git", ref = "main" }

[bootstrap.brew.taps]
"anomalyco/tap" = "https://github.com/anomalyco/homebrew-tap.git"
"jdx/tap" = "https://github.com/jdx/homebrew-tap.git"
"oven-sh/bun" = "https://github.com/oven-sh/homebrew-bun.git"

[bootstrap.packages]
"brew:openssl@3" = "latest"
"brew:agent-browser" = "latest"
"brew:ansible" = "latest"
"brew:antidote" = "latest"
"brew:atuin" = "latest"
"brew:bat" = "latest"
"brew:biome" = "latest"
"brew:btop" = "latest"
"brew:cocoapods" = "latest"
"brew:docker" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git-absorb" = "latest"
"brew:gradle" = "latest"
"brew:imagemagick" = "latest"
"brew:infisical" = "latest"
"brew:jq" = "latest"
"brew:libpq" = "latest"
"brew:luarocks" = "latest"
"brew:mise" = "latest"
"brew:mole" = "latest"
"brew:neovim" = "latest"
"brew:nmap" = "latest"
"brew:pgcli" = "latest"
"brew:pnpm" = "latest"
"brew:ripgrep" = "latest"
"brew:stow" = "latest"
"brew:tmux" = "latest"
"brew:uv" = "latest"
"brew:vite-plus" = "latest"
"brew:watchman" = "latest"
"brew:wget" = "latest"
"brew:worktrunk" = "latest"
"brew:zoxide" = "latest"
"brew:anomalyco/tap/opencode" = "latest"
"brew:oven-sh/bun/bun" = "latest"

"brew-cask:antigravity" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:codex-app" = "latest"
"brew-cask:dockdoor" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:font-cascadia-code" = "latest"
"brew-cask:font-cascadia-mono" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:font-ibm-plex-mono" = "latest"
"brew-cask:font-iosevka-nerd-font" = "latest"
"brew-cask:font-jetbrains-mono" = "latest"
"brew-cask:font-monaspace" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:gimp" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:helium-browser" = "latest"
"brew-cask:jetbrains-toolbox" = "latest"
"brew-cask:jordanbaird-ice" = "latest"
"brew-cask:legcord" = "latest"
"brew-cask:middleclick" = "latest"
"brew-cask:ngrok" = "latest"
"brew-cask:onyx" = "latest"
"brew-cask:opencode-desktop" = "latest"
"brew-cask:openusage" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:t3-code" = "latest"
"brew-cask:tailscale-app" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:zen" = "latest"

[bootstrap.mise_shell_activate]
zshrc = "activate"
zprofile = "shims"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 31
magnification = false
largesize = 16
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = false
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 25
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = false
three_finger_drag = false

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleShowAllExtensions = true, AppleInterfaceStyle = "Dark", NSAutomaticCapitalizationEnabled = true, NSAutomaticPeriodSubstitutionEnabled = true, AppleMiniaturizeOnDoubleClick = false, "com.apple.keyboard.fnState" = false }
"com.apple.dock" = { launchanim = true, "minimize-to-application" = true, mineffect = "scale", "expose-group-apps" = true }
"com.apple.AppleMultitouchTrackpad" = { TrackpadRightClick = true }

[dotfiles]
"~/.zshrc" = {}
"~/.zprofile" = { source = "~/dotfiles/.zprofile.tmpl", mode = "template" }
"~/.zsh_plugins.txt" = {}
"~/.p10k.zsh" = {}
"~/.hushlogin" = {}
"~/.gitconfig" = {}
"~/.gitconfig-alergeek" = {}

"~/.config/ghostty/config" = {}
"~/.config/btop/btop.conf" = {}
"~/.config/nvim" = {}
"~/.config/mise/config.toml" = { source = "~/dotfiles/mise.toml" }
"~/.config/niri/config.kdl" = {}
"~/.config/quickshell" = {}

"~/.agents" = {}
"~/.config/opencode/opencode.jsonc" = {}
"~/.config/opencode/AGENTS.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.codex/AGENTS.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.codex/config.toml" = { block = """
model_instructions_file = "~/dotfiles/.codex/system-prompt-less.md"

[mcp_servers.context7]
type = "http"
url = "https://mcp.context7.com/mcp"

[features]
memories = false

[memories]
generate_memories = false
use_memories = false

[sandbox_workspace_write]
network_access = true
""" }

[tasks.bootstrap]
run = """
if command -v code >/dev/null 2>&1; then
  echo "Installing VS Code extensions..."
  for ext in \
    biomejs.biome \
    bradlc.vscode-tailwindcss \
    charliermarsh.ruff \
    dbaeumer.vscode-eslint \
    eamodio.gitlens \
    enkia.tokyo-night \
    esbenp.prettier-vscode \
    expertlsp.expert \
    expo.vscode-expo-theme \
    formulahendry.auto-rename-tag \
    golang.go \
    jakebecker.elixir-ls \
    jdinhlife.gruvbox \
    johnpapa.vscode-peacock \
    keksiqc.idx-monospace-theme \
    ms-azuretools.vscode-containers \
    ms-python.debugpy \
    ms-python.python \
    ms-python.vscode-pylance \
    ms-python.vscode-python-envs \
    ms-vscode-remote.remote-wsl \
    oxc.oxc-vscode \
    phoenixframework.phoenix \
    rust-lang.rust-analyzer \
    tamasfe.even-better-toml \
    usernamehw.errorlens \
    vscodevim.vim \
    yoavbls.pretty-ts-errors; do
    code --install-extension "$ext" --force || true
  done
else
  echo "code CLI not found, skipping VS Code extensions"
fi
"""
